# ==============================================================================
# ModSecurity Custom Rules & Application Tuning
# Mini Enterprise Secure Portal
# ==============================================================================

# Rule Engine Mode:
# Start with 'DetectionOnly' during baseline monitoring / false-positive analysis.
# Switch to 'On' for production blocking once benign traffic is validated.
SecRuleEngine DetectionOnly

# Request Body Inspection Limits
SecRequestBodyAccess On
SecRequestBodyLimit 1048576
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject

# Response Body Inspection (Off for performance unless scanning for data leaks)
SecResponseBodyAccess Off

# ModSecurity Audit Logging
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/modsec_audit.log
SecAuditLogStorageDir /var/log/modsecurity/audit/

# ------------------------------------------------------------------------------
# Custom Application Rules (Rule ID range: 100000 - 199999)
# ------------------------------------------------------------------------------

# Rule 100001: Block aggressive reconnaissance and vulnerability scanner user agents
SecRule REQUEST_HEADERS:User-Agent "@pmFromFile /etc/nginx/modsec/scanners-user-agents.data" \
    "id:100001,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Reconnaissance scanner user agent detected',\
    tag:'application-waf',\
    tag:'attack-reconciliation'"

# Rule 100002: Block direct probes for sensitive files and source control directories
SecRule REQUEST_URI "@rx \.(env|git|svn|htaccess|bak|sql|config|ini)$" \
    "id:100002,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Sensitive file or backup extension probe blocked',\
    tag:'application-waf',\
    tag:'attack-information-disclosure'"

# Rule 100003: Restrict HTTP methods to GET, POST, HEAD
SecRule REQUEST_METHOD "!@within GET POST HEAD" \
    "id:100003,\
    phase:1,\
    deny,\
    status:405,\
    log,\
    msg:'HTTP method not permitted by reverse-proxy WAF policy',\
    tag:'application-waf',\
    tag:'attack-protocol-violation'"
