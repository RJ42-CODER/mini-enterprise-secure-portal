# ==============================================================================
# Nginx Reverse Proxy Configuration with ModSecurity & OWASP CRS
# Mini Enterprise Secure Portal — Linux CN-Server VM Deployment
# ==============================================================================

# Rate limiting zone: 10 requests per second per client IP with burst buffer
limit_req_zone $binary_remote_addr zone=portal_req_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    # Optional HTTPS termination if TLS certificates are present
    # listen 443 ssl http2;
    # ssl_certificate /etc/ssl/certs/portal.crt;
    # ssl_certificate_key /etc/ssl/private/portal.key;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    # Maximum permitted client request body size (aligned with WAF limit: 1MB)
    client_max_body_size 1M;
    client_body_buffer_size 128k;

    # Enable ModSecurity WAF Engine
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;

    # Access and Error Logging
    access_log /var/log/nginx/secure_portal_access.log combined;
    error_log /var/log/nginx/secure_portal_error.log warn;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reverse Proxy to Internal Flask Backend
    # Note: Flask MUST bind to 127.0.0.1:5000 to prevent external bypass
    location / {
        limit_req zone=portal_req_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Forward authentic client headers to Flask and SOC telemetry agent
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;

        # Disable buffering of streaming responses
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_buffer_size 16k;
    }

    # Restrict direct access to hidden files (.env, .git, .htaccess)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Custom WAF and proxy error pages
    error_page 403 /403_waf.html;
    location = /403_waf.html {
        internal;
        root /usr/share/nginx/html;
    }

    error_page 429 /429_ratelimit.html;
    location = /429_ratelimit.html {
        internal;
        root /usr/share/nginx/html;
    }
}
