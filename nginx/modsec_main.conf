# ==============================================================================
# ModSecurity Main Include Configuration (/etc/nginx/modsec/main.conf)
# ==============================================================================

# Include recommended base configuration
include /etc/nginx/modsec/modsecurity.conf

# Include OWASP ModSecurity Core Rule Set (CRS) setup and rules
include /etc/modsecurity/crs/crs-setup.conf
include /etc/modsecurity/crs/rules/*.conf

# Include application-specific tuning and custom rules
include /etc/nginx/modsec/modsecurity_custom_rules.conf
